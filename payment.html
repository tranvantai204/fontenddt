                <button type="submit">Tìm kiếm</button>

<!-- SECTION: THANH TOÁN -->
<section>
    <h3>Thông Tin Thanh Toán</h3>
    <form id="payment-form">
        <input type="text" id="name" name="name" placeholder="Họ và Tên" required>
        <input type="tel" id="phone" name="phone" placeholder="Số Điện Thoại" required>
        <input type="text" id="address" name="address" placeholder="Địa Chỉ Nhận Hàng" required>
        <select id="payment-method" name="payment-method" required>
            <option value="cash-on-delivery">Thanh Toán Khi Nhận Hàng</option>
            <option value="online-payment">Thanh Toán Ngay</option>
        </select>
        <button type="submit" id="confirm-button">Đặt hàng</button>
    </form>
</section>

<!-- FOOTER -->
<footer>
    <p>&copy; 2024 Trang Bán Hàng.</p>
</footer>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const paymentMethodSelect = document.getElementById('payment-method');
        const confirmButton = document.getElementById('confirm-button');
        const paymentForm = document.getElementById('payment-form');

        paymentMethodSelect.addEventListener('change', function() {
            confirmButton.textContent = (this.value === 'cash-on-delivery') ? 'Đặt hàng' : 'Xác Nhận Thanh Toán';
        });

        paymentForm.addEventListener('submit', function(event) {
            event.preventDefault(); // Ngăn chặn hành vi mặc định của form
            if (paymentForm.checkValidity()) {
                alert(paymentMethodSelect.value === 'cash-on-delivery' ? 'Đặt hàng thành công!' : 'Chuyển đến trang thanh toán.');
                window.location.href = 'payment_steps.html'; // Uncomment to navigate to payment page
            } else {
                alert('Vui lòng điền đầy đủ thông tin.');
            }
        });
    });
</script>

</body>
</html>
